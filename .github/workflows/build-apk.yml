name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename and Prepare APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/Root.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output/Running-out-of-time.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Root-apk
          path: output/*.apk

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0
          name: "Root v1.1.0 (Android APK)"
          body: |
            ## ⏳ Root - Material 3 Android App (v1.1.0)
            **Root** (short for *Running Out Of Time*) is an offline-first time-tracking and productivity intelligence application for Android 9.0+ and Web.
            
            ### ✨ What's New in v1.1.0:
            - **Short App Name "Root"**: Clean launcher icon label and UI.
            - **White Rabbit Icon**: Proper adaptive icon configuration for Android 9+ launchers.
            - **Vertical Phone Screen Optimization**: Responsive layout, fluid typography, no text cutoff or overflow on mobile devices.
            - **Daily Screen-Time Breakdown**: Android Digital Wellbeing / iOS Screen Time style daily usage visualization with color-coded segmented bars.
            - **Corner Tasks & To-Do List**: Quick task list with checkmarks and one-tap tracking.
            - **Interoperable Data Storage**: Open JSON & RFC 4180 CSV export with native Android sharing.
            
            ### 📱 Installation:
            Download `Root.apk` directly on your Android phone and install!
          files: |
            output/Root.apk
            output/Running-out-of-time.apk
          draft: false
          prerelease: false
