name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename and Prepare APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/Running-out-of-time.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Running-out-of-time-apk
          path: output/Running-out-of-time.apk

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Running out of time v1.0.0 (Android APK)"
          body: |
            ## ⏳ Running out of time - Android 9+ APK
            Download the attached `Running-out-of-time.apk` directly onto your Android phone and install it!
            
            ### 📱 Installation Instructions:
            1. Download `Running-out-of-time.apk` on your phone.
            2. Tap the downloaded file in your browser downloads or Files app.
            3. If prompted, allow "Install unknown apps" for your browser/file manager.
            4. Tap **Install** and enjoy!
          files: output/Running-out-of-time.apk
          draft: false
          prerelease: false
